name: Firestore Security Rules

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install security-test dependencies
        run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing firebase-tools vitest

      - name: Run Firestore rules tests
        env:
          FIREBASE_PROJECT_ID: elimu-pro-sms-test
        run: npx firebase emulators:exec --project elimu-pro-sms-test --only firestore "npx vitest run tests/firestore.rules.test.ts"
